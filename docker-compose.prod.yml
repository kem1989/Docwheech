# Docker Compose for production deployment
services:
  postgres:
    environment:
      - POSTGRES_DB=docwheech_prod
    restart: always
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  redis:
    restart: always
    volumes:
      - redis_prod_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    restart: always
    volumes:
      - uploads_prod:/app/uploads
      - logs_prod:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    restart: always

  nginx:
    profiles:
      - production
    restart: always

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  uploads_prod:
    driver: local
  logs_prod:
    driver: local
